spring.application.name=twitterclone
spring.profiles.default=demo
server.port=8081
spring.docker.compose.file=compose.infra.yaml
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/twitterclone
spring.security.oauth2.resourceserver.jwt.audiences=twitterclone-api

springdoc.swagger-ui.oauth.client-id=twitterclone-web
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true
