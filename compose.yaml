include:
  - compose.infra.yaml

services:
  app:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/twitterclone
      SPRING_DATASOURCE_USERNAME: twitterclone
      SPRING_DATASOURCE_PASSWORD: twitterclone
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/twitterclone/protocol/openid-connect/certs
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  web:
    build: frontend
    ports:
      - "5173:8080"
    depends_on:
      - app
